name: Video arsivini guncelle

on:
  schedule:
    - cron: "7 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kanalin RSS akisindan yeni videolari cek
        run: |
          python3 - << 'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET

          CHANNEL = "UC5pUCwGNR9rnoWLfweHcnRw"
          FEED = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL

          req = urllib.request.Request(FEED, headers={"User-Agent": "hypnoscr-archive/1.0"})
          xml = urllib.request.urlopen(req, timeout=30).read()

          NS = {
              "a": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
              "media": "http://search.yahoo.com/mrss/",
          }
          root = ET.fromstring(xml)

          feed = []
          for e in root.findall("a:entry", NS):
              vid = e.findtext("yt:videoId", default="", namespaces=NS)
              title = (e.findtext("a:title", default="", namespaces=NS) or "").strip()
              pub = (e.findtext("a:published", default="", namespaces=NS) or "")[:10]
              views = 0
              st = e.find("media:group/media:community/media:statistics", NS)
              if st is not None:
                  try:
                      views = int(st.get("views", "0"))
                  except ValueError:
                      views = 0
              if vid and title and pub:
                  feed.append([vid, title, views, pub, 0])

          if not feed:
              raise SystemExit("RSS akisi bos dondu - degisiklik yok.")

          with open("videos.json", encoding="utf-8") as f:
              rows = json.load(f)

          by_id = {r[0]: r for r in rows}
          added = 0
          updated = 0

          for item in feed:
              old = by_id.get(item[0])
              if old is None:
                  added += 1
              else:
                  if item[2] > old[2]:
                      old[2] = item[2]
                      updated += 1
                  item[4] = old[4]

          rows = [i for i in feed if i[0] not in by_id] + rows
          rows.sort(key=lambda r: r[3], reverse=True)

          with open("videos.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, ensure_ascii=False, separators=(",", ":"))

          print(str(added) + " yeni, " + str(updated) + " guncellendi, toplam " + str(len(rows)))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("- Yeni video: **" + str(added) + "**\n")
              s.write("- Izlenmesi guncellenen: **" + str(updated) + "**\n")
              s.write("- Toplam: **" + str(len(rows)) + "**\n")
          PY

      - name: Degisiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Arsiv guncellendi (otomatik)"
            git push
          else
            echo "Yeni video yok."
          fi
